<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BDO Helper — Simya Hesaplayıcı</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1>BDO Helper</h1>
  <p class="subtitle">Simya (Alchemy) ham madde hesaplayıcısı</p>
</header>

<main>
  <section class="controls" aria-label="Hesaplama ayarları">
    <div class="control-group">
      <label for="itemSelect">Ne üretmek istiyorsun?</label>
      <select id="itemSelect"></select>
    </div>
    <div class="control-group">
      <label for="targetQty">Kaç adet üretmek istiyorsun?</label>
      <input type="number" id="targetQty" min="1" step="1" value="10">
    </div>
    <button id="resetStockBtn" class="secondary-btn" type="button">Tüm stokları sıfırla</button>
  </section>

  <section class="legend">
    <span class="legend-item"><span class="dot need"></span> Eksik / toplaman gereken</span>
    <span class="legend-item"><span class="dot ok"></span> Elindeki stok yeterli</span>
    <span class="legend-item"><span class="dot raw"></span> Ham madde (üretilmez, toplanır/satın alınır)</span>
  </section>

  <section id="tree" class="tree" aria-label="İhtiyaç ağacı"></section>
</main>

<footer>
  <p>Veriler <a href="https://bdocodex.com" target="_blank" rel="noopener">bdocodex.com</a> kaynak alınarak hazırlanmıştır. Oyun içi güncellemelerle miktarlar değişebilir.</p>
</footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
