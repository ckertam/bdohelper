<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BDO Helper — Simya Hesaplayıcı</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="shell">
  <div id="planTabsBar">
    <div id="planTabs" role="tablist" aria-label="Üretim planları"></div>
    <button type="button" id="planTabsAdd" title="Yeni üretim planı">+</button>
  </div>

  <div id="targetBar">
    <div class="tb-brand">
      <span class="tb-brand-name">BDO HELPER</span>
      <button type="button" class="tb-skill-tag" id="skillTag" data-skill="alchemy"></button>
    </div>
    <button type="button" class="tb-summary" id="targetSummary">
      <img id="tsIcon" class="tb-summary-icon" alt="" hidden>
      <span class="tb-summary-text">
        <span class="tb-summary-title" id="tsTitle"></span>
        <span class="tb-summary-meta" id="tsMeta"></span>
      </span>
    </button>
    <div class="tb-progress" id="tbProgress" hidden>
      <div class="tb-progress-head"><span id="progLabel">İLERLEME</span><span id="progPct">%0</span></div>
      <div class="tb-progress-track"><div class="tb-progress-fill" id="progFill" style="width:0%"></div></div>
      <div class="tb-progress-sub" id="progSub"></div>
    </div>
    <div class="tb-lang" role="group" aria-label="Language / Dil">
      <button type="button" class="lang-btn" data-lang="tr">TR</button>
      <button type="button" class="lang-btn" data-lang="en">EN</button>
    </div>
  </div>

  <section id="targetEditor" hidden>
    <div class="te-row">
      <div class="field" style="flex:1 1 320px;max-width:480px">
        <label id="whatToMakeLabel">Ne üretmek istiyorsun?</label>
        <div class="te-search">
          <input type="text" id="itemSearch" placeholder="Ürün ara...">
        </div>
        <select id="itemSelect" class="input"></select>
      </div>
      <div class="field">
        <label id="skillLabel">Meslek</label>
        <div class="seg" role="group" aria-label="Skill / Meslek">
          <button type="button" class="seg-opt skill-btn" data-skill="alchemy">Simya</button>
          <button type="button" class="seg-opt skill-btn" data-skill="cooking">Aşçılık</button>
        </div>
      </div>
      <div class="field">
        <label id="howManyLabel">Adet</label>
        <input type="number" id="targetQty" class="input" min="1" step="1" value="10" style="width:100px">
      </div>
      <div class="field" id="masteryGroup">
        <label id="masteryLabel">Simya Mastery</label>
        <div style="display:flex;align-items:center;gap:10px">
          <input type="number" id="masteryInput" class="input" min="0" max="3000" step="1" value="0" style="width:100px">
          <span class="mastery-hint" id="masteryHint"></span>
        </div>
      </div>
      <button type="button" class="btn btn-primary" id="targetEditorClose">HESAPLA</button>
    </div>
  </section>

  <div id="commandBar">
    <div class="search-box" id="searchBox">
      <span class="search-icon">⌕</span>
      <input type="text" id="globalSearch" placeholder="Malzeme veya ürün ara — / ile odaklan">
      <span class="search-count" id="searchCount" hidden></span>
      <button type="button" class="search-clear" id="searchClear" hidden>✕</button>
    </div>
    <div class="seg" id="viewSwitch">
      <button type="button" class="seg-opt" data-view="funnel">HUNİ</button>
      <button type="button" class="seg-opt" data-view="table">TABLO</button>
    </div>
    <button type="button" class="btn" id="onlyMissingBtn">SADECE EKSİKLER</button>
    <button type="button" class="btn" id="countMoneyBtn">PARAYLA ÇÖZÜLENLERİ SAY</button>
    <span class="spacer"></span>
    <button type="button" class="btn" id="gatherBtn">TOPLAMA LİSTESİ</button>
    <button type="button" class="btn" id="stockDrawerBtn">STOK GİR</button>
    <button type="button" class="btn" id="resetStockBtn">SIFIRLA</button>
  </div>

  <div id="focusBar" hidden></div>
</header>

<main>
  <section class="legend">
    <span class="legend-item"><span id="legendMissing">Eksik / toplaman gereken — kırmızı sayı</span></span>
    <span class="legend-item"><span id="legendOk">Elindeki stok yeterli — ✓</span></span>
    <span class="legend-item"><span id="legendRaw">Ham madde — üretilmez, toplanır/satın alınır</span></span>
  </section>

  <section id="funnelView" class="view" aria-label="İhtiyaç ağacı"></section>

  <section id="tableView" hidden>
    <div class="tv-toolbar">
      <div class="seg" id="tierFilter"></div>
      <button type="button" class="btn btn-ghost" id="sortResetBtn" hidden>EKSİKLER ÜSTTE</button>
    </div>
    <div class="table-head" id="tableHead"></div>
    <div id="tableRows"></div>
    <div class="no-results-footer" id="tableFooter" hidden></div>
  </section>

  <section id="gatherView" hidden></section>
</main>

<div id="drawerBackdrop" hidden></div>
<aside id="stockDrawer" hidden aria-label="Toplu stok girişi">
  <div class="drawer-head">
    <span class="dh-title" id="drawerTitle">Toplu Stok Girişi</span>
    <button type="button" id="drawerClose">✕</button>
  </div>
  <div class="search-box drawer-search-box" id="drawerSearchBox">
    <span class="search-icon">⌕</span>
    <input type="text" id="drawerSearch" placeholder="Malzeme ara...">
    <button type="button" class="search-clear" id="drawerSearchClear" hidden>✕</button>
  </div>
  <div class="drawer-chips" id="drawerChips">
    <button type="button" class="seg-opt" data-chip="missing">SADECE EKSİKLER</button>
    <button type="button" class="seg-opt" data-chip="raw">SADECE HAM</button>
    <button type="button" class="seg-opt" data-chip="entered">GİRİLENLER</button>
  </div>
  <div id="stockDrawerList"></div>
</aside>

<div id="undoToast" class="undo-toast" hidden></div>

<footer>
  <p id="footerText">Veriler <a href="https://bdocodex.com" target="_blank" rel="noopener">bdocodex.com</a> kaynak alınarak hazırlanmıştır. Oyun içi güncellemelerle miktarlar değişebilir.</p>
</footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
